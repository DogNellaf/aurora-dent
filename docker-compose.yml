# docker compose up --build            -> the app on SQLite, http://localhost:8080
# docker compose --profile sqlserver up --build   -> the same app on SQL Server, http://localhost:8081
services:
  app:
    build: .
    image: aurora-dent:local
    ports:
      - "8080:8080"
    environment:
      Seed__DemoData: "true"
    volumes:
      - app-data:/data
    healthcheck:
      # The runtime image has no curl, so talk HTTP over a bash TCP socket.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health HTTP/1.0\\r\\n\\r\\n' >&3 && head -n1 <&3 | grep -q 200"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    restart: unless-stopped

  # Optional: the same application on SQL Server instead of SQLite.
  sqlserver:
    profiles: ["sqlserver"]
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Aurora_Dent_123"
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  app-sqlserver:
    profiles: ["sqlserver"]
    build: .
    image: aurora-dent:local
    ports:
      - "8081:8080"
    environment:
      Database__Provider: SqlServer
      ConnectionStrings__DefaultConnection: "Server=sqlserver;Database=dental_clinic;User Id=sa;Password=Aurora_Dent_123;TrustServerCertificate=True"
      Seed__DemoData: "true"
    depends_on:
      sqlserver:
        condition: service_healthy

volumes:
  app-data:
  mssql-data:

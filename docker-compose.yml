# docker compose up --build
#   app   http://localhost:8080
#   mail  http://localhost:8025 (Mailpit, shows every email the app sends: booking confirmations, password resets)
#   db    SQL Server on localhost:1433 (handy for `dotnet run` and `dotnet test` on the host)
services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Aurora_Dent_123"
    ports:
      - "127.0.0.1:1433:1433"
    volumes:
      - db-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  mail:
    image: ghcr.io/axllent/mailpit:v1.20
    ports:
      - "127.0.0.1:8025:8025"

  app:
    build: .
    image: aurora-dent:local
    ports:
      # Local only on purpose: the demo accounts have a published password. To publish the demo on a server,
      # change this line and think about Seed__DemoData first.
      - "127.0.0.1:8080:8080"
    environment:
      ConnectionStrings__DefaultConnection: "Server=db;Database=dental_clinic;User Id=sa;Password=Aurora_Dent_123;TrustServerCertificate=True"
      Seed__DemoData: "true"
      Clinic__PublicUrl: "http://localhost:8080"
      Email__Host: mail
      Email__Port: "1025"
    depends_on:
      db:
        condition: service_healthy
      mail:
        condition: service_started
    healthcheck:
      # The runtime image has no curl, so talk HTTP over a bash TCP socket.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health HTTP/1.0\\r\\n\\r\\n' >&3 && head -n1 <&3 | grep -q 200"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    restart: unless-stopped

volumes:
  db-data:

version: 2
updates:
  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: weekly
    groups:
      microsoft:
        patterns: ["Microsoft.*"]
      testing:
        patterns: ["xunit*", "coverlet*", "Microsoft.NET.Test.Sdk"]
  - package-ecosystem: nuget
    directory: "/DentalClinic.Tests"
    schedule:
      interval: weekly
    groups:
      microsoft:
        patterns: ["Microsoft.*"]
      testing:
        patterns: ["xunit*", "coverlet*"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly

version: 2
updates:
  # The application targets .NET 8 (LTS). Microsoft packages and the base images stay on 8.x,
  # a move to a new major version is a deliberate change, not an automatic pull request.
  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: weekly
    groups:
      microsoft:
        patterns: ["Microsoft.*"]
    ignore:
      - dependency-name: "Microsoft.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "dotnet-ef"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: nuget
    directory: "/DentalClinic.Tests"
    schedule:
      interval: weekly
    groups:
      microsoft:
        patterns: ["Microsoft.*"]
      testing:
        patterns: ["xunit*", "coverlet*"]
    ignore:
      - dependency-name: "Microsoft.*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "dotnet/*"
        update-types: ["version-update:semver-major"]
